<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Mutrikuko Eskola Kirola</title>

  <!-- Boogaloo letra-tipoa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon.512.png">

  <meta name="theme-color" content="#709f1d">
</head>

<body>

  <!-- SPLASH PANTAILA -->
  <div id="splash">
    <div class="splash-edukia">
      <img
        src="images/icon.512.png"
        alt="Mutrikuko Eskola Kirola"
        class="splash-logoa"
      >

      <p class="splash-marka">MEKE</p>

      <h1>Mutrikuko Eskola Kirola</h1>

      <p class="splash-azpititulua">
        Langileentzako aplikazioa
      </p>

      <p class="splash-ikasturtea">
        2026–2027
      </p>

      <div class="splash-kargatzen">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>


  <!-- APLIKAZIOA -->
  <div id="aplikazioa" class="aplikazioa-ezkutuan">

    <header>
      <div class="header-edukia">

        <img
          src="images/icon.192.png"
          alt="MEKE logoa"
          class="header-logoa"
        >

        <div>
          <p class="header-marka">MEKE</p>
          <h1>Mutrikuko Eskola Kirola</h1>
          <p class="header-azpititulua">
            Langileentzako aplikazioa
          </p>
        </div>

      </div>
    </header>

    <main>

      <nav class="menu-nagusia">

        <button onclick="erakutsiAtala('hasiera')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 11.5 12 4l9 7.5M5.5 10.5V20h13v-9.5M9.5 20v-6h5v6"
            />
          </svg>
          <span>Hasiera</span>
        </button>

        <button onclick="erakutsiAtala('abisuak')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 17H9m9-2V11a6 6 0 0 0-12 0v4l-2 2h16l-2-2Zm-7 5h2"
            />
          </svg>
          <span>Abisuak</span>
        </button>

        <button onclick="erakutsiAtala('ordutegia')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"
            />
          </svg>
          <span>Ordutegia</span>
        </button>

        <button onclick="erakutsiAtala('kokalekuak')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Zm0-9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
            />
          </svg>
          <span>Kokalekuak</span>
        </button>

        <button onclick="erakutsiAtala('ikasturtekoEgutegia')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Zm3 8h3m2 0h3m-8 4h3m2 0h3"
            />
          </svg>
          <span>Ikasturteko egutegia</span>
        </button>

        <button onclick="erakutsiAtala('begiraleenEgutegia')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3 3 8l9 5 9-5-9-5Zm-6 8v5c3 3 9 3 12 0v-5M21 9v6"
            />
          </svg>
          <span>Begiraleen egutegia</span>
        </button>

        <button onclick="erakutsiAtala('taldeak')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7-1a3 3 0 1 0 0-6m-7 9c-4 0-7 2-7 5v2h14v-2c0-3-3-5-7-5Zm7 1c3 0 6 1.5 6 4v2h-5"
            />
          </svg>
          <span>Taldeak</span>
        </button>

        <button onclick="erakutsiAtala('dokumentuak')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6 3h8l4 4v14H6V3Zm8 0v5h5M9 13h6m-6 4h6"
            />
          </svg>
          <span>Dokumentuak</span>
        </button>

        <button onclick="erakutsiAtala('protokoloak')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 5h6m-8 2H5v14h14V7h-2M9 3h6v4H9V3Zm0 9h6m-6 4h6"
            />
          </svg>
          <span>Protokoloak</span>
        </button>

      </nav>

      <section id="edukia">
        <p>Hasiera kargatzen...</p>
      </section>

    </main>

  </div>


  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }

    window.addEventListener("load", () => {
      erakutsiAtala("hasiera");

      setTimeout(() => {
        document
          .getElementById("splash")
          .classList.add("splash-ezkutatu");

        document
          .getElementById("aplikazioa")
          .classList.remove("aplikazioa-ezkutuan");

        setTimeout(() => {
          document.getElementById("splash").style.display = "none";
        }, 600);
      }, 1900);
    });
  </script>

</body>
</html>
